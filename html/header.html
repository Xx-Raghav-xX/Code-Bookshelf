<header class="keep-header" id="keep-header">
  
  <!-- Left: Main Menu & Brand -->
  <div class="header-left">
    <div class="tooltip-container" data-tooltip="Main menu">
      <button class="icon-btn" id="menu-toggle-btn" aria-label="Main menu">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
        </svg>
      </button>
    </div>
    <a href="#" class="brand-logo" title="Code Bookshelf">
      <div class="brand-icon">
        <svg viewBox="0 0 36 36" width="36" height="36">
          <!-- Shelf frame -->
          <rect x="3" y="4" width="30" height="28" rx="4" fill="#1A73E8"/>
          <rect x="5" y="6" width="26" height="24" rx="2" fill="#202124"/>
          <!-- Shelf divider -->
          <rect x="5" y="18" width="26" height="2" fill="#3C4043"/>
          <!-- Top Row Books -->
          <rect x="7" y="8" width="4" height="9" rx="1" fill="#EA4335"/>
          <rect x="12" y="9" width="4" height="8" rx="1" fill="#FBBC04"/>
          <rect x="17" y="7" width="5" height="10" rx="1" fill="#34A853"/>
          <rect x="23" y="10" width="4" height="7" rx="1" fill="#8AB4F8"/>
          <!-- Bottom Row Code Books -->
          <rect x="7" y="21" width="5" height="8" rx="1" fill="#FDD663"/>
          <rect x="13" y="20" width="4" height="9" rx="1" fill="#F28B82"/>
          <rect x="18" y="22" width="5" height="7" rx="1" fill="#81C995"/>
          <rect x="24" y="20" width="4" height="9" rx="1" fill="#C58AF9"/>
        </svg>
      </div>
      <span class="brand-title">Code Bookshelf</span>
    </a>
  </div>

  <!-- Center: Search Bar Component -->
  <div class="header-center">
    <div class="search-bar" id="search-bar">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
      </div>
      <input type="text" class="search-input" id="search-input" placeholder="Search" aria-label="Search">
      
      <!-- Clear Search Button -->
      <div class="tooltip-container" data-tooltip="Clear search">
        <button class="icon-btn search-clear-btn" id="search-clear-btn" aria-label="Clear search">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
          </svg>
        </button>
      </div>

      <!-- Filter Dropdown Button -->
      <div class="tooltip-container" data-tooltip="Filter search">
        <button class="icon-btn" id="search-filter-btn" aria-label="Filter search">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"></path>
          </svg>
        </button>
      </div>

      <!-- Search Filter Popover Menu -->
      <div class="popover-menu" id="search-filter-popover" style="width: 240px; padding: 12px;">
        <div class="popover-title" style="margin-bottom: 8px;">Filter Notes By:</div>
        <div class="filter-section-label">Programming Language</div>
        <select class="language-select-dropdown" id="filter-language-select" style="width: 100%; margin-bottom: 12px;">
          <option value="all">All Languages</option>
          <option value="javascript">JavaScript (JS)</option>
          <option value="python">Python 3 (PY)</option>
          <option value="java">Java (JAVA)</option>
          <option value="cpp">C++ (C++)</option>
          <option value="c">C (GCC)</option>
          <option value="sql">SQL (SQLite)</option>
          <option value="rust">Rust (RS)</option>
          <option value="go">Go (GO)</option>
          <option value="html">HTML/CSS (Preview)</option>
        </select>

        <div class="filter-section-label">Note Type</div>
        <select class="language-select-dropdown" id="filter-type-select" style="width: 100%; margin-bottom: 12px;">
          <option value="all">All Types</option>
          <option value="code">Code Snippets Only</option>
          <option value="checklist">Checklists Only</option>
          <option value="text">Standard Text Only</option>
        </select>

        <button class="creator-btn-close" id="clear-filters-btn" style="width: 100%; text-align: center; justify-content: center; background-color: var(--hover-bg); color: var(--text-primary);">Reset Filters</button>
      </div>
    </div>
  </div>

  <!-- Right: Header Quick Actions -->
  <div class="header-right">
    
    <!-- Refresh Button -->
    <div class="tooltip-container" data-tooltip="Refresh">
      <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path>
        </svg>
      </button>
    </div>

    <!-- Grid / List View Toggle Button -->
    <div class="tooltip-container" id="view-toggle-container" data-tooltip="List view">
      <button class="icon-btn" id="view-toggle-btn" aria-label="Toggle view">
        <!-- List View Icon (Default Grid mode) -->
        <svg id="view-icon-list" viewBox="0 0 24 24" focusable="false">
          <path d="M4 14h4v-4H4v4zm0 5h4v-4H4v4zM4 9h4V5H4v4zm5 5h12v-4H9v4zm0 5h12v-4H9v4zM9 5v4h12V5H9z"></path>
        </svg>
        <!-- Grid View Icon (Hidden by default) -->
        <svg id="view-icon-grid" viewBox="0 0 24 24" focusable="false" style="display: none;">
          <path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm8 6h8v-8h-8v8zm2-6h4v4h-4v-4z"></path>
        </svg>
      </button>
    </div>

    <!-- Dark Mode Toggle Button -->
    <div class="tooltip-container" id="theme-toggle-container" data-tooltip="Dark theme">
      <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme">
        <!-- Moon Icon (Dark Mode) -->
        <svg id="theme-icon-moon" viewBox="0 0 24 24" focusable="false">
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"></path>
        </svg>
        <!-- Sun Icon (Light Mode) -->
        <svg id="theme-icon-sun" viewBox="0 0 24 24" focusable="false" style="display: none;">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0zm-12.37 12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"></path>
        </svg>
      </button>
    </div>

    <!-- Settings Gear Button -->
    <div class="tooltip-container" data-tooltip="Settings">
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"></path>
        </svg>
      </button>
    </div>

  </div>
</header>
